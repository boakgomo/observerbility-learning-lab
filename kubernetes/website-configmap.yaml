
apiVersion: v1
kind: ConfigMap
metadata:
  name: website-html
  namespace: default

data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>My Customized K8s Site</title>
      <style>
        body {
          font-family: sans-serif;
          text-align: center;
          background: #fef3c7;
          padding: 50px;
        }
        h1 {
          color: #b45309;
        }
        p {
          color: #78350f;
          font-size: 1.2rem;
        }
        .badge {
          background: #d97706;
          color: white;
          padding: 5px 10px;
          border-radius: 5px;
        }
      </style>
    </head>
    <body>
      <h1>Welcome to Mustapha's Website! 🔥</h1>
      <p>I just updated this code live inside
        <span class="badge">Kubernetes</span>.
      </p>
    </body>
    </html>

