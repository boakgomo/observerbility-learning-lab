
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-website
  namespace: default
  labels:
    app: my-website

spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-website

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  template:
    metadata:
      labels:
        app: my-website

    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10

          volumeMounts:
            - name: website-content
              mountPath: /usr/share/nginx/html
              readOnly: true

      volumes:
        - name: website-content
          configMap:
            name: website-html
