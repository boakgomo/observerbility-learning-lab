
name: Java CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t java-hello-world:ci \
            projects/java-hello-world

      - name: Start Java container
        run: |
          docker run -d --name java-app \
            -p 127.0.0.1:8080:8080 \
            java-hello-world:ci

      - name: Test Java application
        run: |
          response=$(curl --fail --silent --show-error \
            --retry 10 --retry-connrefused \
            --retry-delay 2 http://localhost:8080)
          echo "$response"
          test "$response" = "Hello World - Version 1.0"

      - name: Display application logs
        if: always()
        run: docker logs java-app || true

      - name: Cleanup container
        if: always()
        run: docker rm -f java-app || true

